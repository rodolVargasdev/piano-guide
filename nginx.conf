# Non-root nginx: pid and temp paths live under /tmp, listening on 8080.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers live at server level only. Do not add `add_header` inside a
    # location: nginx would then stop inheriting these. Cache rules use `expires`.
    # The sha256 in script-src is the hash of the inline import map in index.html;
    # tests/csp.test.js fails when the two drift apart.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-X1C/zBSV4pEZDTwnTt1xBTqswqmuAflNagMDyo7FL7I='; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
      try_files $uri $uri/ =404;
    }

    # Entry page and song data change often: always revalidate (Cache-Control: no-cache).
    location = /index.html {
      expires -1;
    }
    location ~ ^/songs/.+\.json$ {
      expires -1;
      types { application/json json; }
    }

    # Modules must be served as JavaScript (module scripts reject other types).
    location ~ \.(js|mjs)$ {
      types { application/javascript js mjs; }
    }

    # Vendored libraries are pinned by version and hash: cache them for a year.
    # ^~ makes this prefix win over the regex location above.
    location ^~ /assets/vendor/ {
      types { application/javascript js mjs; }
      expires 1y;
    }
  }
}
