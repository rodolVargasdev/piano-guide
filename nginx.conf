# Non-root nginx: pid and temp paths live under /tmp, listening on 8080.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    # TODO(PR 4): add the SHA-256 of the inline import map to script-src
    # ('sha256-...'). Until index.html carries the import map, 'self' is enough.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
      try_files $uri $uri/ =404;
    }

    # Entry page and song data change often: always revalidate.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location ~ ^/songs/.+\.json$ {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      types { application/json json; }
    }

    # Modules must be served as JavaScript (module scripts reject other types).
    location ~ \.(js|mjs)$ {
      types { application/javascript js mjs; }
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Vendored libraries are pinned by version and hash: cache them for a year.
    location /assets/vendor/ {
      types { application/javascript js mjs; }
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
