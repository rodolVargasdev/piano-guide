<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-hidden="true" focusable="false">
  <!-- Original artwork for lesson zero: a person seen from the side, sitting tall at a piano. No text. -->
  <rect width="320" height="180" fill="#f4efe2"/>
  <line x1="10" y1="164" x2="310" y2="164" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
  <!-- piano: body, white keys, black keys -->
  <rect x="196" y="112" width="112" height="52" rx="4" fill="#374151"/>
  <rect x="196" y="104" width="112" height="10" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <g fill="#111827">
    <rect x="206" y="104" width="6" height="6"/>
    <rect x="218" y="104" width="6" height="6"/>
    <rect x="238" y="104" width="6" height="6"/>
    <rect x="250" y="104" width="6" height="6"/>
    <rect x="262" y="104" width="6" height="6"/>
  </g>
  <!-- bench -->
  <rect x="44" y="120" width="76" height="10" rx="3" fill="#92400e"/>
  <line x1="54" y1="130" x2="54" y2="164" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="130" x2="110" y2="164" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <!-- person: straight back, thigh level, shin down, foot flat -->
  <g fill="none" stroke="#1f2937" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 118 L90 60"/>
    <path d="M84 118 L150 118 L150 158 L172 158"/>
    <path d="M92 66 L112 98 L168 98"/>
  </g>
  <circle cx="93" cy="42" r="14" fill="#f2b880" stroke="#1f2937" stroke-width="3"/>
  <!-- the hand: a curved arch resting on the keys -->
  <path d="M166 98 Q180 88 192 100" fill="none" stroke="#f2b880" stroke-width="9" stroke-linecap="round"/>
  <path d="M166 98 Q180 88 192 100" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- forearm level with the keys -->
  <line x1="112" y1="98" x2="196" y2="98" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/>
</svg>
